name: deploy-pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app.js', 'index.html', 'style.css', '.github/workflows/deploy.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/kline
            data/kline_raw
            data/hk/kline
            data/hk/kline_raw
          key: kline-deploy-${{ github.run_id }}
          restore-keys: kline-
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - uses: actions/deploy-pages@v5
        id: deployment
