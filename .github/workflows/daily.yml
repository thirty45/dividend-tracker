name: daily-update

on:
  schedule:
    # 工作日（周一至周五）北京时间 18:00 = 10:00 UTC 跑一次
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      notify:
        description: Send configured external alerts
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 恢复K线缓存
        id: kline-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/kline
            data/kline_raw
            data/hk/kline
            data/hk/kline_raw
            data/hk/kline_segments
          key: kline-${{ github.run_id }}
          restore-keys: |
            kline-

      - name: 每日更新数据
        id: update
        run: python pipeline/update_daily.py
        env:
          PYTHONUNBUFFERED: '1'
          SERVERCHAN_KEY: ${{ (github.event_name != 'workflow_dispatch' || inputs.notify) && secrets.SERVERCHAN_KEY || '' }}
          WECOM_WEBHOOK: ${{ (github.event_name != 'workflow_dispatch' || inputs.notify) && secrets.WECOM_WEBHOOK || '' }}

      - name: 构建红利/宽基基金数据
        id: funds
        run: python pipeline/funds.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: 构建可转债数据
        id: cbonds
        continue-on-error: true
        run: python pipeline/cbonds.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: 构建港股通数据
        id: hk
        continue-on-error: true
        run: python pipeline/hk.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: 构建社保基金调仓数据
        id: social
        run: python pipeline/social_security.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: 构建国资红利数据
        id: soe
        run: python pipeline/soe.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: 刷新指数调仓提醒
        id: rebalance
        continue-on-error: true
        run: python pipeline/rebalance.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: 补齐并检查个股K线覆盖
        id: repair
        run: python pipeline/repair_kline.py --repair
        env:
          PYTHONUNBUFFERED: '1'
          # 陈旧（最后一根K线早于目标交易日）比例：>10% 警告，>50% 本步骤失败、不提交不部署
          KLINE_STALE_WARN_RATIO: '0.10'
          KLINE_STALE_FAIL_RATIO: '0.50'

      - name: 保存K线缓存
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            data/kline
            data/kline_raw
            data/hk/kline
            data/hk/kline_raw
            data/hk/kline_segments
          key: kline-${{ github.run_id }}

      - name: 汇报模块状态
        if: always()
        run: python pipeline/status_report.py
        env:
          OUTCOME_UPDATE: ${{ steps.update.outcome }}
          OUTCOME_REPAIR: ${{ steps.repair.outcome }}
          OUTCOME_FUNDS: ${{ steps.funds.outcome }}
          OUTCOME_CBONDS: ${{ steps.cbonds.outcome }}
          OUTCOME_HK: ${{ steps.hk.outcome }}
          OUTCOME_SOCIAL: ${{ steps.social.outcome }}
          OUTCOME_SOE: ${{ steps.soe.outcome }}
          OUTCOME_REBALANCE: ${{ steps.rebalance.outcome }}

      - name: 提交数据变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "chore: 每日数据更新 $(date -u +%F)"
          git pull --rebase -X theirs origin main
          git push

      - name: 配置 Pages
        uses: actions/configure-pages@v6

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: update-and-deploy
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
