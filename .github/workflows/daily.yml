name: daily-update

on:
  schedule:
    # 每天 15:15（北京时间 = 07:15 UTC），收盘后更新一次
    - cron: '15 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 每日更新数据
        run: python pipeline/update_daily.py
        env:
          PYTHONUNBUFFERED: '1'
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}

      - name: 构建红利/宽基基金数据
        run: python pipeline/funds.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: 提交数据变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "chore: 每日数据更新 $(date -u +%F)"
          git pull --rebase -X theirs origin main
          git push

      - name: 配置 Pages
        uses: actions/configure-pages@v6

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
